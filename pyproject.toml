[project]
name = "betterwhiteboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Elliot Gobbert", email = "ElliotGobbert@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=2.0.0",
    "mediapipe<=0.10.20",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "opencv-python>=5.0.0.93",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
betterwhiteboard = "betterwhiteboard:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
